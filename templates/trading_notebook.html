<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Тетрадка · Рабочее пространство</title>
<!-- notebook-ui: houses-v2 ratings-after-sample -->
{% include "partials/chart_js_async.html" %}
<style>
  :root{
    --bg:#0e1116;--panel:#161b22;--panel-2:#1c232d;--line:#2a323d;
    --ink:#e6edf3;--muted:#8b98a8;--dim:#5d6875;
    --buy:#2ea043;--buy-soft:#1a3a24;--sell:#d9534f;--sell-soft:#3a1e1d;
    --warn:#d6a516;--warn-soft:#3a3110;--accent:#4a9eda;
    --mono:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
    --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 20px 80px;}
  header.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px;}
  header.top h1{font-size:19px;font-weight:700;letter-spacing:-.3px;margin:0;}
  header.top .sub{color:var(--dim);font-size:13px;font-family:var(--mono);}
  .principle{color:var(--muted);font-size:13px;margin:6px 0 18px;border-left:2px solid var(--line);padding-left:12px;}

  /* group nav */
  .group-nav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .gbtn{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 12px;font-size:12.5px;color:var(--muted);transition:.15s;display:flex;align-items:center;gap:7px;}
  .gbtn:hover{border-color:var(--dim);color:var(--ink);}
  .gbtn.on{background:var(--panel-2);color:var(--ink);}
  .gbtn .gd{width:8px;height:8px;border-radius:2px;}
  .gd1{background:#6f7cff;} .gd2{background:#ff8a3d;} .gd3{background:#4a9eda;} .gdn{background:#8b98a8;}
  .gbtn .cnt{font-family:var(--mono);font-size:11px;color:var(--dim);}

  /* group meta */
  .gmeta{background:var(--panel-2);border-radius:10px;padding:11px 15px;margin-bottom:16px;font-size:12.5px;color:var(--muted);line-height:1.5;}
  .gmeta b{color:var(--ink);}

  /* ticker switch */
  .ticker-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .tk{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:150px;transition:.15s;}
  .tk:hover{border-color:var(--dim);}
  .tk.on{border-color:var(--accent);background:var(--panel-2);}
  .tk .row1{display:flex;align-items:center;gap:8px;}
  .tk .sym{font-weight:700;font-size:16px;letter-spacing:.3px;}
  .tk .grp{font-size:10px;font-family:var(--mono);padding:2px 6px;border-radius:5px;font-weight:600;}
  .grp.g1{background:rgba(111,124,255,.16);color:#a2abff;}
  .grp.g2{background:rgba(255,138,61,.16);color:#ffb27d;}
  .grp.g3{background:rgba(74,158,218,.16);color:#8cc7f0;}
  .grp.gn{background:rgba(139,152,168,.16);color:#aeb9c6;}
  .tk .px{font-family:var(--mono);font-size:13px;color:var(--muted);}
  .tk .chg{font-size:12px;font-family:var(--mono);}
  .up{color:var(--buy);} .down{color:var(--sell);}
  .empty-grp{color:var(--dim);font-size:13px;padding:18px 4px;font-style:italic;}
  .grp-tools{
    display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;margin-bottom:14px;
  }
  .grp-tools .gt-label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);font-weight:700;margin-right:4px;}
  .grp-tools input[type=text]{
    width:88px;background:var(--bg);border:1px solid var(--line);border-radius:7px;
    color:var(--ink);font-family:var(--mono);font-size:13px;padding:6px 8px;
  }
  .grp-tools select{
    background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--ink);
    font-size:12.5px;padding:6px 8px;max-width:160px;
  }
  .grp-tools .gt-status{font-size:12px;color:var(--muted);min-height:1em;}
  .grp-tools .gt-status.err{color:#ef8582;} .grp-tools .gt-status.ok{color:#5fd67c;}
  .grp-tools .gt-sep{width:1px;height:22px;background:var(--line);margin:0 2px;}
  @media(max-width:640px){.grp-tools .gt-sep{display:none;}}

  /* macro calendar (calendar.html style) */
  .cal-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:0;}
  .cal-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .cal-head h4{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);}
  .cal-head .gen{font-family:var(--mono);font-size:11px;color:var(--dim);}
  .cal-toolbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .erow{display:grid;grid-template-columns:62px 10px minmax(0,1fr) 58px;align-items:center;gap:8px;min-height:32px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:13px;}
  .erow:last-child{border-bottom:0;}
  .erow.focus{background:rgba(46,194,126,.08);}
  .erow .date{font-family:var(--mono);font-weight:700;font-size:12px;white-space:nowrap;}
  .erow .title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
  .erow .symbol{font-family:var(--mono);font-weight:800;font-size:12px;text-align:right;color:var(--ink);}
  .erow .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);}
  .erow.economic .dot{background:#4c7dff;}
  .erow.fomc .dot{background:#f5c542;}
  .erow.earnings .dot{background:#2ec27e;}
  .cal-empty{padding:20px;text-align:center;color:var(--dim);font-family:var(--mono);font-size:12px;}
  .cal-legend{display:flex;gap:12px;padding:8px 12px;font-size:11px;color:var(--dim);border-top:1px solid var(--line);flex-wrap:wrap;}
  .cal-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;}
  .cal-legend .lg-e{background:#4c7dff;} .cal-legend .lg-f{background:#f5c542;} .cal-legend .lg-a{background:#2ec27e;}

  /* guide / glossary */
  .guide-card h3{margin:0 0 10px;}
  .guide-card h4{margin:18px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;}
  .guide-card p,.guide-card li{color:var(--muted);font-size:13.5px;line-height:1.5;}
  .guide-card p{margin:0 0 10px;}
  .guide-card ul{margin:0 0 10px;padding-left:18px;}
  .guide-card li{margin:5px 0;}
  .guide-card b{color:var(--ink);font-weight:600;}
  .guide-card .gex{background:var(--panel-2);border-radius:10px;padding:12px 14px;margin:10px 0 14px;border-left:3px solid var(--accent);}
  .guide-card .gex b{display:block;margin-bottom:4px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--accent);}
  .guide-table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 14px;}
  .guide-table th,.guide-table td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top;}
  .guide-table th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;width:28%;}
  .guide-table td{color:var(--muted);}
  .guide-table tr:first-child th,.guide-table tr:first-child td{border-top:none;}
  .guide-ol{margin:0;padding-left:20px;}
  .guide-ol li{margin:8px 0;color:var(--muted);font-size:13.5px;}
  .guide-ol b{color:var(--ink);}

  /* tabs */
  nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;}
  nav.tabs button{background:none;border:none;color:var(--muted);font-family:var(--sans);font-size:13.5px;font-weight:500;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:.15s;}
  nav.tabs button:hover{color:var(--ink);}
  nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);}

  .tab-body{display:none;}
  /* No fade here: renderContent() rebuilds innerHTML often; animation looked like constant blinking. */
  .tab-body.on{display:block;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;}
  .card h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;}
  .card h3 .hint{text-transform:none;letter-spacing:0;color:var(--dim);font-weight:400;font-size:12px;margin-left:8px;}

  .trig{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-top:1px solid var(--line);}
  .trig:first-of-type{border-top:none;}
  .badge{font-family:var(--mono);font-size:10px;font-weight:700;padding:4px 8px;border-radius:6px;letter-spacing:.5px;white-space:nowrap;margin-top:1px;}
  .b-buy{background:var(--buy-soft);color:#5fd67c;}
  .b-sell{background:var(--sell-soft);color:#ef8582;}
  .b-add{background:rgba(74,158,218,.14);color:#7cc0ef;}
  .b-watch{background:var(--warn-soft);color:#e8c65a;}
  .trig .body{flex:1;}
  .trig .lvl{font-family:var(--mono);font-weight:700;font-size:15px;}
  .trig .desc{color:var(--muted);font-size:13px;margin-top:2px;}
  .trig .cond{color:var(--dim);font-size:12px;margin-top:3px;font-style:italic;}
  .manual{display:inline-block;font-size:10px;font-family:var(--mono);padding:1px 6px;border-radius:4px;background:rgba(214,165,22,.14);color:#e8c65a;margin-left:6px;vertical-align:middle;}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px;}
  .kv .k{color:var(--muted);}
  .kv .v{font-family:var(--mono);text-align:right;}

  ul.clean{margin:0;padding-left:18px;}
  ul.clean li{margin:6px 0;color:var(--muted);font-size:13.5px;}
  ul.clean li b{color:var(--ink);font-weight:600;}

  .env{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;}
  .env:first-of-type{border-top:none;}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .dot.ok{background:var(--buy);} .dot.mid{background:var(--warn);} .dot.bad{background:var(--sell);}
  .env .lbl{flex:1;}
  .env .st{font-family:var(--mono);font-size:12px;color:var(--muted);}

  .house{border-top:1px solid var(--line);padding:13px 0;}
  .house:first-of-type{border-top:none;}
  .house .hh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .house .firm{font-weight:700;font-size:14px;}
  .house .rate{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:5px;background:var(--panel-2);color:var(--muted);}
  .house .pt{font-family:var(--mono);font-weight:700;color:var(--accent);margin-left:auto;font-size:14px;}
  .house .quote{color:var(--muted);font-size:13px;margin-top:6px;border-left:2px solid var(--line);padding-left:10px;font-style:italic;}
  .house .tac{color:var(--ink);font-size:13px;margin-top:6px;}
  .house .tac b{color:#ff8a3d;}

  .concens{
    display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;
    margin:0 0 14px;padding:12px 16px;background:var(--panel-2);border-radius:10px;
  }
  .concens .cell{display:flex;flex-direction:column;gap:2px;}
  .concens .cl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;}
  .concens .cv{font-family:var(--mono);font-size:16px;font-weight:700;}
  .houses-list{margin-top:4px;}
  .houses-list .house:first-of-type{border-top:none;padding-top:4px;}

  .note{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.45;}
  .macro{background:var(--panel-2);border-radius:10px;padding:13px 15px;font-size:13px;color:var(--muted);margin-top:12px;}
  .macro b{color:var(--ink);}
  .upd{font-size:11px;font-family:var(--mono);color:var(--dim);float:right;font-weight:400;text-transform:none;letter-spacing:0;}

  .flag-panel{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
  .flag-panel h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;}
  .flag-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px;}
  .flag-row:first-of-type{border-top:none;}
  .flag-row .fl{color:var(--ink);}
  .flag-row .fh{display:block;font-size:11.5px;color:var(--dim);margin-top:2px;font-weight:400;}
  .flag-toggle{position:relative;width:44px;height:24px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;flex:none;transition:.15s;padding:0;}
  .flag-toggle.on{background:rgba(46,160,67,.35);border-color:rgba(46,160,67,.55);}
  .flag-toggle.warn{background:rgba(217,83,79,.35);border-color:rgba(217,83,79,.55);}
  .flag-toggle:disabled{opacity:.45;cursor:wait;}
  .flag-toggle .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:.15s;}
  .flag-toggle.on .knob,.flag-toggle.warn .knob{left:22px;}
  .flag-status{font-size:11.5px;font-family:var(--mono);color:var(--dim);margin-top:8px;min-height:1.2em;}
  .flag-status.err{color:#ef8582;}
  .flag-status.ok{color:#5fd67c;}

  .edit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 12px;margin-top:4px;}
  .edit-field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);margin-bottom:4px;font-weight:600;}
  .edit-field input,.edit-field textarea{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink);
    font-family:var(--mono);font-size:14px;padding:8px 10px;
  }
  .edit-field textarea{font-family:var(--sans);font-size:13px;min-height:56px;resize:vertical;}
  .edit-field input:focus,.edit-field textarea:focus{outline:none;border-color:var(--accent);}
  .edit-actions{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap;}
  .edit-btn{
    cursor:pointer;border:1px solid rgba(74,158,218,.45);background:rgba(74,158,218,.16);color:#7cc0ef;
    border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;font-family:var(--sans);
  }
  a.edit-btn{display:inline-block;text-decoration:none;box-sizing:border-box;}
  .edit-btn:hover{background:rgba(74,158,218,.28);}
  .edit-btn:disabled{opacity:.45;cursor:wait;}
  .houses-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;}
  .houses-toolbar .flag-status{margin:0;}
  .env-state-btns{display:flex;gap:4px;flex:none;}
  .env-sbtn{
    cursor:pointer;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);
    border-radius:6px;padding:4px 9px;font-size:11px;font-family:var(--mono);font-weight:700;
  }
  .env-sbtn.on.ok{background:rgba(46,160,67,.28);border-color:rgba(46,160,67,.5);color:#5fd67c;}
  .env-sbtn.on.mid{background:rgba(214,165,22,.28);border-color:rgba(214,165,22,.5);color:#e8c65a;}
  .env-sbtn.on.bad{background:rgba(217,83,79,.28);border-color:rgba(217,83,79,.5);color:#ef8582;}
  .env-sbtn:disabled{opacity:.45;cursor:wait;}
  .env-edit-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;}
  .env-edit-row:first-of-type{border-top:none;}
  .env-edit-row .el{color:var(--ink);flex:1;}
  .env-edit-row .es{display:block;font-size:11.5px;color:var(--dim);margin-top:2px;}

  .stub-tag,.live-tag,.manual-tag{
    display:inline-flex;align-items:center;gap:5px;margin-left:8px;padding:2px 8px;border-radius:999px;
    font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.2px;vertical-align:middle;
    white-space:nowrap;max-width:min(100%,420px);overflow:hidden;text-overflow:ellipsis;
  }
  .stub-tag{background:rgba(232,198,90,.18);color:#e8c65a;border:1px solid rgba(232,198,90,.45);}
  .live-tag{background:rgba(46,160,67,.14);color:#5fd67c;border:1px solid rgba(46,160,67,.35);}
  .manual-tag{background:rgba(74,158,218,.14);color:#7cc0ef;border:1px solid rgba(74,158,218,.4);}
  .stub-box{
    margin:10px 0 14px;padding:10px 12px;border-radius:10px;
    background:rgba(232,198,90,.08);border:1px dashed rgba(232,198,90,.4);
    font-size:12.5px;color:var(--muted);line-height:1.45;
  }
  .stub-box b{color:#e8c65a;}
  .data-legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;align-items:center;}
  .data-legend .hint-txt{font-size:12px;color:var(--dim);}
  nav.tabs button .tab-stub{
    display:inline-block;width:7px;height:7px;border-radius:50%;background:#e8c65a;margin-left:6px;
    vertical-align:middle;opacity:.95;
  }

  footer{color:var(--dim);font-size:11.5px;margin-top:26px;line-height:1.5;border-top:1px solid var(--line);padding-top:14px;}

  /* digest */
  .digest-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .digest-head .dt{font-family:var(--mono);font-size:13px;color:var(--muted);}
  .digest-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px;padding:10px 12px;background:var(--panel-2);border-radius:10px;}
  .digest-nav select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:12px;font-family:var(--mono);max-width:min(100%,320px);}
  .digest-nav .edit-btn{padding:4px 10px;}
  .digest-nav .dn-meta{font-size:12px;color:var(--muted);font-family:var(--mono);}
  .digest-nav .dn-live{font-size:11px;color:#5fd67c;font-family:var(--mono);}
  .digest-filter{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px;}
  .digest-filter select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:12px;font-family:var(--mono);}
  .digest-filter .df-count{font-size:12px;color:var(--muted);font-family:var(--mono);}
  .src-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;}
  .src-table th,.src-table td{text-align:left;padding:5px 8px;border-top:1px solid var(--line);vertical-align:top;}
  .src-table th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:600;}
  .src-table .n{font-family:var(--mono);text-align:right;white-space:nowrap;}
  .wl-cand{border-top:1px solid var(--line);padding:10px 0;}
  .wl-cand:first-of-type{border-top:none;padding-top:0;}
  .wl-cand .wl-sym{font-family:var(--mono);font-weight:700;font-size:14px;margin-right:8px;}
  .wl-cand .wl-src{font-size:11px;color:var(--dim);font-family:var(--mono);}
  .wl-cand .wl-text{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45;}
  .wl-cand .wl-rat{font-size:12.5px;color:var(--ink);margin-top:4px;line-height:1.4;}
  .pipe-table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 4px;}
  .pipe-table th,.pipe-table td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top;}
  .pipe-table th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;width:32%;}
  .pipe-table td{color:var(--muted);}
  .pipe-table .pval{color:var(--ink);font-family:var(--mono);font-size:12.5px;}
  .filterstat{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;font-family:var(--mono);margin-bottom:14px;}
  .fstat{padding:4px 10px;border-radius:7px;background:var(--panel-2);color:var(--muted);}
  .fstat b{color:var(--ink);}
  .fstat.trash{color:var(--dim);}
  .fstat.keep{color:#5fd67c;}

  .bucket{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-top:1px solid var(--line);}

  /* verdict */

  .verdict-hero.buy{background:linear-gradient(135deg,rgba(46,160,67,.14),rgba(46,160,67,.04));border-color:rgba(46,160,67,.4);}

  .verdict-hero .vlabel{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px;}

  .ind-row .iname{width:170px;font-size:13px;font-weight:600;flex:none;}

  .nsent-arts{margin-top:10px;width:100%;}
  .nsent-arts .na{padding:8px 0;border-top:1px solid var(--line);font-size:12.5px;}

  .fund-m .fk{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);font-weight:700;}
  .fund-m .fv{font-family:var(--mono);font-size:16px;font-weight:700;margin-top:4px;}
  .fund-m .fv.good{color:#5fd67c;} .fund-m .fv.bad{color:#ef8582;} .fund-m .fv.mid{color:#e8c65a;}
  .fund-m .fn{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35;}

  .fund-list{margin:0;padding-left:18px;}

  .fund-passport{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px 14px;margin:0 0 12px;padding:10px 12px;background:var(--panel-2);border-radius:10px;border:1px solid var(--line);}
  .fund-passport .fp-k{font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:var(--dim);font-weight:700;}
  .fund-passport .fp-v{font-size:13px;color:var(--ink);margin-top:2px;line-height:1.35;}
  .fund-block-lbl{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--dim);font-weight:700;margin:14px 0 6px;}
  .fund-reconcile{margin:10px 0 0;padding:10px 12px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--muted);line-height:1.45;}

  .re-row input:focus,.re-row textarea:focus{outline:none;border-color:var(--accent);}

  .re-src-ok{color:#5fd67c;} .re-src-miss{color:#e8c65a;} .re-src-bad{color:#ef8582;}
  .nb-home{font-size:12px;color:var(--dim);margin-left:auto;}
  .nb-home a{color:var(--accent);text-decoration:none;}

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Рабочая тетрадка</h1>
    <span class="sub" id="asof">загрузка…</span>
    <span class="nb-home"><a href="/">← LSE</a></span>
  </header>
  <p class="principle" id="principle"></p>

  <div class="group-nav" id="groupNav"></div>
  <div class="gmeta" id="groupMeta"></div>
  <div class="grp-tools" id="groupTools"></div>
  <div class="ticker-bar" id="tickerBar"></div>

  <nav class="tabs" id="tabs"></nav>
  <div id="content"><div class="card"><p class="note">Загрузка данных…</p></div></div>

  <footer>
    Уровни и гейты Вердикта сохраняются по кнопкам OK / переключателям. Close — справочно для сравнения с Buy Dip / Sell, не авто-покупка.
  </footer>
</div>

<script id="boot" type="application/json">{{ boot_json | safe }}</script>
<script>

let GROUPS = {};
let DATA = {};
let WATCHLIST = {rules:[], flash:{}};
let DIGEST = {date:"", filtered:0, kept:0, trashed:0, signals:[], risks:[], macro:[], newtickers:[], trashNote:""};
let DIGEST_BUCKETS = [];
let DIGEST_PIPELINE = {};
let DIGEST_SNAPSHOT_ID = "latest";
let DIGEST_SNAPSHOTS = []; // [{id, date, ...}]
let DIGEST_SNAPSHOTS_LOADED = false;
let DIGEST_RETAIN_DAYS = 14;
let SA_SECTIONS = null; // catalog pack from /api/notebook/sa-sections
let SA_FEED = null; // KB feed payload
let SA_FEED_TRIED = false;
let SA_SECTION_HYDRATING = false;
let SA_SECTION_BUSY = false;
let SA_FEED_FILTER = ""; // section_id or symbol filter
let _digestHydrateInflight = false;
let _digestAutoLatestTried = false;
let _digestOptsSynced = false;
let NEWS_SOURCES = {ingest_channels:[], kb_sources_14d:[], note_ru:""};
let digestTickerFilter = ""; // "" = all (only when not following current)
let digestSourceFilter = ""; // "" = all
let digestTickerFollowCurrent = true; // default: filter = current ticker
let CALENDAR = {events:[], days:21, asof_utc:"", counts:{}};
let housesRefreshFlash = null; // {sym, ok, text}

const TABS = [
  {id:"verdict",label:"⚡ Вердикт",stub:false},
  {id:"chart",label:"График",stub:false},
  {id:"profile",label:"Профиль",stub:false},
  {id:"triggers",label:"Триггеры Buy / Sell",stub:false},
  {id:"entry",label:"Тактика входа / выхода",stub:false},
  {id:"env",label:"Окружение",stub:false},  // VIX live + ФРС/PT editable
  {id:"events",label:"Events",stub:false},
  {id:"houses",label:"Инвестдома",stub:false},
  {id:"fundament",label:"Фундамент",stub:false},
  {id:"report_expect",label:"Ожидания от репорта",stub:false},
  {id:"digest",label:"Дайджесты",stub:false},
  {id:"watchlist",label:"Watchlist",stub:false},
  {id:"guide",label:"Пояснения",stub:false},
];

function stubBadge(where){
  let w = String(where || "").trim();
  // Avoid "заглушка · заглушка · …" when source already carries the word.
  w = w.replace(/^заглушка\s*[·:]\s*/i, "").trim();
  return `<span class="stub-tag" title="${esc(w || "заглушка")}">заглушка · ${esc(w || "вручную")}</span>`;
}
function liveBadge(where){
  return `<span class="live-tag" title="${esc(where)}">live · ${esc(where)}</span>`;
}
/** Fields Nastya fills by hand (judgment / approve). */
function nastyaTag(){
  return `<span class="manual-tag" title="Суждение / правка Насти · не авто из KB">✓ Настя</span>`;
}
/** Facts drafted from earnings release / knowledge_base / news cron. */
function reportSrcTag(){
  return `<span class="live-tag" title="Факт из IR/SEC Event Brief + KB · кнопка «Подтянуть»">IR/SEC · KB</span>`;
}
/** Auto from news KB / digest pipeline. */
function newsKbTag(){
  return reportSrcTag();
}
function manualBadge(where){
  return `<span class="manual-tag" title="${esc(where)}">вручную · ${esc(where)}</span>`;
}
function stubBox(title, where){
  return `<div class="stub-box"><b>${esc(title)}</b> — брать из: ${esc(where)}</div>`;
}

let digestVariant = "digest";
let currentGroup = "1";
let current = null;
let activeTab = "verdict";

function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

/** Strip leftover HTML / «Источник» lines from older StockAnalysis overlays. */
function houseQuoteLine(h){
  let q = String((h && h.quote) || "").trim();
  const tac = String((h && h.tac) || "").trim();
  if(/источник|stockanalysis|<\s*b\s*>/i.test(q)) q = "";
  if(tac && !/источник|stockanalysis|<\s*\/?\s*b\s*>/i.test(tac) && tac !== q){
    q = q ? (q + " · " + tac) : tac;
  }
  return q;
}

function cleanHouseNote(note){
  let s = String(note || "").trim();
  if(/карточки|overlay|консенсус тоже/i.test(s)){
    const m = s.match(/Buy\s+\d+\s*[·\/]\s*Hold\s+\d+\s*[·\/]\s*Sell\s+\d+/i);
    return m ? m[0].replace(/\//g, "·") : "";
  }
  return s.replace(/^StockAnalysis:\s*/i, "");
}

/** Analyst Buy/Hold/Sell totals for the bottom consensus panel. */
function housesRatingStats(d){
  const c = (d && d.houses_counts) || {};
  let buy = Number(c.buy);
  let hold = Number(c.hold);
  let sell = Number(c.sell);
  if(!Number.isFinite(buy) || !Number.isFinite(hold) || !Number.isFinite(sell) || (buy+hold+sell) === 0){
    const note = cleanHouseNote(d && d.houseNote);
    const m = String(note||"").match(/Buy\s+(\d+)\s*[·\/]\s*Hold\s+(\d+)\s*[·\/]\s*Sell\s+(\d+)/i);
    if(m){
      buy = Number(m[1]); hold = Number(m[2]); sell = Number(m[3]);
    }
  }
  // Last resort: tally visible house cards (subset, not full SA sample).
  if(!Number.isFinite(buy) || !Number.isFinite(hold) || !Number.isFinite(sell) || (buy+hold+sell) === 0){
    buy = hold = sell = 0;
    (d.houses||[]).forEach(h => {
      const r = String((h && h.rate) || "").toLowerCase();
      if(/strong\s*buy|buy|overweight|outperform|accumulate/i.test(r) && !/sell/.test(r)) buy += 1;
      else if(/hold|neutral|equal|market\s*perform|peer/i.test(r)) hold += 1;
      else if(/sell|underweight|underperform|reduce/i.test(r)) sell += 1;
    });
  }
  const cards = (d.houses||[]).length;
  const total = (Number.isFinite(buy)?buy:0) + (Number.isFinite(hold)?hold:0) + (Number.isFinite(sell)?sell:0);
  const nRatings = Number(c.total);
  const nTargets = Number(c.pt_total);
  const cons = (d && d.consensus) || {};
  let fromConsN = null;
  const mN = String(cons.n || "").match(/(\d+)/);
  if(mN) fromConsN = Number(mN[1]);
  return {
    buy: Number.isFinite(buy) ? buy : 0,
    hold: Number.isFinite(hold) ? hold : 0,
    sell: Number.isFinite(sell) ? sell : 0,
    total,
    cards,
    nRatings: Number.isFinite(nRatings) && nRatings > 0 ? nRatings
      : (Number.isFinite(Number(cons.n_ratings)) ? Number(cons.n_ratings)
      : (Number.isFinite(fromConsN) ? fromConsN : total || null)),
    nTargets: Number.isFinite(nTargets) && nTargets > 0 ? nTargets
      : (Number.isFinite(Number(cons.n_targets)) ? Number(cons.n_targets) : null),
  };
}

function consensusPtDisplay(cons, houses){
  const raw = cons && cons.pt != null ? String(cons.pt).trim() : "";
  if(raw && raw !== "—" && raw !== "-" && raw !== "–") return raw;
  // Fallback: mean of latest house targets (rightmost $ number) if overlay still empty.
  const vals = [];
  (houses || []).forEach(h => {
    const s = String((h && h.pt) || "");
    const nums = s.replace(/,/g, "").match(/\$?\s*(\d+(?:\.\d+)?)/g);
    if(!nums || !nums.length) return;
    const last = nums[nums.length - 1].replace(/[^\d.]/g, "");
    const v = parseFloat(last);
    if(Number.isFinite(v) && v > 0) vals.push(v);
  });
  if(!vals.length) return "—";
  const avg = vals.reduce((a,b)=>a+b,0) / vals.length;
  return "$" + (Math.abs(avg - Math.round(avg)) < 0.05 ? String(Math.round(avg)) : avg.toFixed(2));
}

function applyBoot(boot){
  GROUPS = boot.groups || {};
  DATA = boot.tickers || {};
  WATCHLIST = boot.watchlist || {rules:[], flash:{}};
  DIGEST = boot.digest || DIGEST;
  DIGEST_BUCKETS = boot.digest_buckets || [];
  DIGEST_PIPELINE = boot.digest_pipeline || {};
  DIGEST_SNAPSHOT_ID = boot.digest_snapshot_id || "latest";
  NEWS_SOURCES = boot.news_sources || NEWS_SOURCES;
  CALENDAR = boot.calendar || CALENDAR;
  const principle = boot.principle_ru || "";
  document.getElementById("principle").innerHTML = principle;
  document.getElementById("asof").textContent = boot.asof_label || ("schema v"+(boot.schema_version||""));

  if(DATA.MSFT){ startG = String(DATA.MSFT.group); startT = "MSFT"; }
  currentGroup = startG;
  current = startT;
}

async function addTickerToGroup(){
  const inp = document.getElementById("addSym");
  const sel = document.getElementById("addGroup");
  const btn = document.getElementById("addBtn");
  const sym = String((inp && inp.value) || "").trim().toUpperCase();
  const group = String((sel && sel.value) || currentGroup || "n");
  if(!sym){ setGrpToolStatus("укажите тикер", "err"); return; }
  if(btn) btn.disabled = true;
  setGrpToolStatus("добавляю + свечи/новости…");
  try{
    const r = await fetch("/api/notebook/tickers", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({sym, group, updated_by:"notebook-ui", bootstrap:true}),
    });
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.detail || j.error || ("HTTP "+r.status));
    const card = j.card || {sym: j.ticker || sym, group: j.group || group, px:null, chg:"—", up:true, name:sym};
    const u = String(card.sym || j.ticker || sym).toUpperCase();
    DATA[u] = Object.assign({}, DATA[u] || {}, card, {sym:u, group:String(j.group || group)});
    if(inp) inp.value = "";
    currentGroup = String(DATA[u].group);
    current = u;
    const boot = j.bootstrap || {};
    const q = boot.quotes || {};
    const sa = boot.news_sa || {};
    const yh = boot.news_yahoo || {};
    const bits = [];
    if(q.ok) bits.push(`свечи ${q.rows_upserted|0}`);
    else if(q.error) bits.push("свечи ✗");
    if(sa.ok) bits.push(`SA +${sa.kb_inserted|0}`);
    else if(sa.skipped) bits.push("SA skip");
    else if(sa.error) bits.push("SA ✗");
    if(yh.ok) bits.push(`Yahoo +${yh.kb_inserted|0}`);
    else if(yh.error) bits.push("Yahoo ✗");
    setGrpToolStatus(`${u} → GRP ${DATA[u].group}` + (bits.length ? ` · ${bits.join(" · ")}` : ""), "ok");
    renderGroupNav(); renderGroupTools(); renderTickers(); renderContent();
  }catch(e){
    setGrpToolStatus(String(e.message || e), "err");
  }finally{
    if(btn) btn.disabled = false;
  }
}

function fmtPx(px){
  if(px==null || px==="") return "—";
  const n = Number(px);
  if(!Number.isFinite(n)) return "—";
  return "$" + n.toLocaleString("en-US", {maximumFractionDigits: 2});
}

function applyFundamentDraft(f, opts){
  const o = opts || {};
  const set = (id, v) => {
    const el = document.getElementById(id);
    if(el && v != null && String(v).trim()) el.value = String(v);
  };
  if(o.touchPassportA){
    set("fund-exchange", f.exchange || "");
    set("fund-hq", f.hq_ru || "");
    set("fund-listing", f.listing_origin_ru || "");
  }
  if(o.touchTagline) set("fund-tagline", f.tagline || "");
  set("fund-margin", f.margin_ru || "");
  if(f.financing_ru != null && String(f.financing_ru).trim()){
    set("fund-financing", f.financing_ru || "");
  }
  // key_clients / pluses / risks — не трогаем (Настя), даже если API прислал пустые
  if(f.filing_url){
    set("fund-filing-url", f.filing_url);
    const secA = document.getElementById("fund-sec");
    if(secA){ secA.href = String(f.filing_url); secA.textContent = "Открыть сохранённый filing"; }
  }
  const metrics = Array.isArray(f.metrics) ? f.metrics : [];
  for(let i=0;i<4;i++){
    const m = metrics[i] || {};
    set("fund-mk-"+i, m.k || "");
    set("fund-mv-"+i, m.v || "");
    set("fund-mn-"+i, m.note || "");
  }
}

function renderFundReconcileBox(j){
  const box = document.getElementById("fund-reconcile-box");
  if(!box) return;
  const conflicts = Array.isArray(j.conflicts) ? j.conflicts : [];
  const quotes = Array.isArray(j.evidence_quotes) ? j.evidence_quotes : [];
  const meta = j.material_meta || {};
  const bits = [];
  if(meta.event_date) bits.push(String(meta.event_date).slice(0, 10));
  if(meta.material_type) bits.push(String(meta.material_type));
  if(j.filing_period) bits.push("период " + String(j.filing_period));
  const head = bits.length ? bits.join(" · ") : "Ex99/IR";
  let html = `<h4>Сверка LLM · ${esc(head)}</h4>`;
  if(conflicts.length){
    html += `<ul>${conflicts.map(c => {
      const field = esc(c.field || "—");
      const y = esc(c.yahoo || "—");
      const f = esc(c.filing || "—");
      const n = esc(c.note || "");
      return `<li class="fr-conflict"><b>${field}</b>: Yahoo ${y} → filing ${f}${n ? ` · ${n}` : ""}</li>`;
    }).join("")}</ul>`;
  } else {
    html += `<p class="note" style="margin:0">Явных конфликтов в ответе нет — всё равно сверьте глаза перед OK.</p>`;
  }
  if(quotes.length){
    html += `<ul style="margin-top:8px">${quotes.map(q =>
      `<li class="fr-quote">«${esc(q.quote||"")}» <span class="note">· ${esc(q.topic||"")}</span></li>`
    ).join("")}</ul>`;
  }
  box.innerHTML = html;
  box.hidden = false;
}

async function reconcileFundamentLlm(){
  const sym = current;
  if(!sym || !DATA[sym]) return;
  const status = document.getElementById("fundSuggestStatus");
  const btnY = document.getElementById("fund-suggest");
  const btnR = document.getElementById("fund-reconcile");
  if(btnY) btnY.disabled = true;
  if(btnR) btnR.disabled = true;
  if(status){ status.className = "flag-status"; status.textContent = "сверка LLM…"; }
  try {
    const r = await fetch(`/api/notebook/tickers/${encodeURIComponent(sym)}/fundament/reconcile-llm`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({}),
    });
    const j = await r.json().catch(() => ({}));
    if(!r.ok){
      throw new Error((j && (j.detail || j.error)) || (`HTTP ${r.status}`));
    }
    // Metrics / margin / financing / filing only — do not wipe passport A or tagline from Yahoo.
    applyFundamentDraft(j.fundament || {}, {touchNastya:false, touchPassportA:false, touchTagline:false});
    renderFundReconcileBox(j);
    const n = Number(j.conflict_count != null ? j.conflict_count : (j.conflicts || []).length) || 0;
    if(status){
      status.className = n ? "flag-status" : "flag-status ok";
      status.textContent = (j.note || ("конфликтов: " + n)) + " · не сохранено";
    }
  } catch(e){
    if(status){ status.className = "flag-status err"; status.textContent = "ошибка: " + (e.message || e); }
    const box = document.getElementById("fund-reconcile-box");
    if(box){
      box.hidden = false;
      box.innerHTML = `<h4>Сверка LLM</h4><p class="note" style="margin:0;color:#ef8582">${esc(String(e.message||e))}</p>`;
    }
  } finally {
    if(btnY) btnY.disabled = false;
    if(btnR) btnR.disabled = false;
  }
}

function triggerLvlDisplay(t, L){
  const kind = String(t.t||"");
  if(kind === "buy" && L.buyDip != null) return `$${L.buyDip} · Buy Dip`;
  if(kind === "sell" && L.sell != null) return `$${L.sell} · Sell`;
  return t.lvl || "";
}

function renderTriggers(d){
  const L = d.levels || {};
  const list = (d.triggers && d.triggers.length) ? d.triggers : [
    {t:"buy", lvl:"", desc:"", cond:""},
    {t:"sell", lvl:"", desc:"", cond:""},
    {t:"watch", lvl:"Наблюдение", desc:"", cond:""},
  ];
  const map = {buy:["b-buy","BUY"],sell:["b-sell","SELL"],add:["b-add","ADD"],watch:["b-watch","WATCH"]};
  const rows = list.map((t, idx) => {
    const kind = String(t.t||"watch");
    const [cls,txt] = map[kind] || ["b-watch","?"];
    const lvl = triggerLvlDisplay(t, L);
    const lvlLocked = (kind === "buy" || kind === "sell");
    const lvlHint = lvlLocked
      ? (lvl || "задайте на Вердикте")
      : "";
    return `<div class="trig" data-trig-idx="${idx}">
      <span class="badge ${cls}">${txt}</span>
      <div class="body" style="flex:1">
        <input type="hidden" class="tr-t" value="${esc(kind)}">
        ${lvlLocked
          ? `<div class="lvl">${esc(lvlHint)} <span class="manual">$ на Вердикте</span></div>`
          : `<div class="edit-field" style="margin:4px 0"><input type="text" class="tr-lvl" value="${esc(t.lvl||'')}" placeholder="заголовок Watch"></div>`}

          <textarea class="tr-desc" style="min-height:52px">${esc(t.desc||'')}</textarea></div>

          <input type="text" class="tr-cond" value="${esc(t.cond||'')}" placeholder="когда пересматривать"></div>
      </div>
    </div>`;
  }).join("");
  return `<div class="card">
    <h3>Триггеры <span class="hint">Buy/Sell $ — на Вердикте; тексты и Watch — здесь</span></h3>
    ${rows}

  </div>`;
}

async function saveTriggers(){
  const sym = current;
  if(!sym || !DATA[sym]) return;
  const status = document.getElementById("trStatus");
  const btn = document.getElementById("tr-save");
  if(btn) btn.disabled = true;
  if(status){ status.className = "flag-status"; status.textContent = "…"; }
  try {
    const triggers = [];
    document.querySelectorAll(".trig[data-trig-idx]").forEach(row => {
      const t = (row.querySelector(".tr-t") || {}).value || "watch";
      const descEl = row.querySelector(".tr-desc");
      const condEl = row.querySelector(".tr-cond");
      const lvlEl = row.querySelector(".tr-lvl");
      const item = {
        t,
        desc: descEl ? String(descEl.value||"").trim() : "",
        cond: condEl ? String(condEl.value||"").trim() : "",
      };
      if(lvlEl) item.lvl = String(lvlEl.value||"").trim();
      triggers.push(item);
    });
    const r = await fetch(`/api/notebook/tickers/${encodeURIComponent(sym)}/triggers`, {
      method: "PATCH",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({triggers}),
    });
    const j = await r.json().catch(() => ({}));
    if(!r.ok){
      throw new Error((j && (j.detail || j.error)) || (`HTTP ${r.status}`));
    }
    if(Array.isArray(j.triggers)) DATA[sym].triggers = j.triggers;
    DATA[sym].triggers_override = true;
    applyOverrideMeta(sym, j);
    renderContent();
  } catch(e){
    if(status){ status.className = "flag-status err"; status.textContent = "ошибка: " + (e.message || e); }
    if(btn) btn.disabled = false;
  }
}

  const re = d.report_expect || {};

  const factRows = [

    {id:"re-margin", lbl:"Маржа / путь к прибыли", ph:"EBITDA / FCF динамика", hint:"Из отчёта cash flow / margins.", val:w.margin_path_ru},

  ];
  const watchFields = factRows.map(r => `<div class="re-row">
      <label><span>${esc(r.lbl)}</span> ${reportSrcTag()}</label>

function envSourceHint(lbl){
  const s = String(lbl||"").toLowerCase();
  if(s.includes("vix")) return "live quotes/^VIX";
  if(s.includes("ndx") || s.includes("nasdaq")) return "live quotes/^NDX";
  if(s.includes("нефт") || s.includes("oil") || s.includes("геопол")) return "live quotes/CL=F";
  if(s.includes("фрс") || s.includes("fed")) return "live · federalreserve.gov FOMC";
  if(s.includes("таргет") || s.includes("pt")) return "вручную · PT cuts вне earnings";
  return "вручную JSON";
}

async function hydrateSaSectionsQuiet(force){
  if(SA_SECTION_HYDRATING) return;
  SA_SECTION_HYDRATING = true;
  let changed = !!force;
  try{
    if(force || !SA_SECTIONS){
      const r = await fetch("/api/notebook/sa-sections");
      const j = await r.json().catch(() => ({}));
      if(r.ok){
        SA_SECTIONS = j;
        changed = true;
      }
    }
    if(force || !SA_FEED_TRIED){
      const q = new URLSearchParams({ hours: "72", limit: "120" });
      if(SA_FEED_FILTER){
        if(String(SA_FEED_FILTER).startsWith("SA:")) q.set("symbol", SA_FEED_FILTER);
        else q.set("section_id", SA_FEED_FILTER);
      }
      const r2 = await fetch("/api/notebook/sa-sections/feed?" + q.toString());
      SA_FEED_TRIED = true;
      if(r2.ok){
        SA_FEED = await r2.json().catch(() => null);
        changed = true;
      }
    }
    if(changed && digestVariant === "sa") renderContent();
  }catch(e){
    console.warn("sa sections hydrate", e);
  }finally{
    SA_SECTION_HYDRATING = false;
  }
}

async function toggleSaSection(id, checked){
  const sid = String(id || "").trim();
  if(!sid) return;
  try{
    const body = { sections: { [sid]: !!checked } };
    const limEl = document.getElementById("sa-sec-limit");
    if(limEl && limEl.value) body.per_group_limit = Number(limEl.value) || undefined;
    const r = await fetch("/api/notebook/sa-sections/subscriptions", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const j = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error((j && j.detail) || (`HTTP ${r.status}`));
    SA_SECTIONS = j;
    if(digestVariant === "sa") renderContent();
  }catch(e){
    console.warn("sa subscribe", e);
    alert("Подписка: " + (e && e.message ? e.message : e));
  }
}

async function runSaIngest(allSections){
  if(SA_SECTION_BUSY) return;
  SA_SECTION_BUSY = true;
  if(digestVariant === "sa") renderContent();
  try{
    const limEl = document.getElementById("sa-sec-limit");
    const lim = limEl ? Number(limEl.value) : undefined;
    const body = { include_tickers: true, include_sections: true };
    if(lim) body.limit = lim;
    if(allSections) body.all_available = true;
    const r = await fetch("/api/notebook/sa-sections/ingest", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const j = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error((j && j.detail) || (`HTTP ${r.status}`));
    alert("В KB добавлено строк: " + Number(j.kb_inserted_total || 0));
    SA_FEED_TRIED = false;
    await hydrateSaSectionsQuiet(true);
  }catch(e){
    alert("Ingest: " + (e && e.message ? e.message : e));
  }finally{
    SA_SECTION_BUSY = false;
    if(digestVariant === "sa") renderContent();
  }
}

function effectiveDigestTickerFilter(){
  if(digestTickerFollowCurrent && current){
    return String(current).toUpperCase();
  }
  return String(digestTickerFilter || "").trim().toUpperCase();
}

function setDigestTickerFilter(v){
  digestTickerFilter = String(v || "").trim().toUpperCase();
  digestTickerFollowCurrent = false; // explicit pick (incl. «Все»)
  renderContent();
}
function setDigestSourceFilter(v){
  digestSourceFilter = String(v || "").trim();
  renderContent();
}
function resetDigestFilters(){
  digestTickerFollowCurrent = true;
  digestTickerFilter = current ? String(current).toUpperCase() : "";
  digestSourceFilter = "";
  renderContent();
}

function digestItemMatchesTicker(it, filt){
  if(!filt) return true;
  const sym = String((it && it.sym) || "").toUpperCase();
  if(!sym) return false;
  if(sym === filt) return true;
  // "MSFT · Azure" or "МАКРО · semis" style labels
  const head = sym.split(/[·|,/\s]+/)[0];
  return head === filt || sym.indexOf(filt) >= 0;
}

function digestItemMatchesSource(it, filt){
  if(!filt) return true;
  const src = String((it && it.src) || "").toLowerCase();
  if(!src) return false;
  return src === filt.toLowerCase() || src.indexOf(filt.toLowerCase()) >= 0;
}

function digestItemMatchesFilter(it, tickerFilt, sourceFilt){
  return digestItemMatchesTicker(it, tickerFilt) && digestItemMatchesSource(it, sourceFilt);
}

function digestFilterSyms(d){
  const seen = new Set();
  const out = [];
  ["signals","risks","macro","newtickers"].forEach(k => {
    (d[k] || []).forEach(it => {
      const raw = String((it && it.sym) || "").trim();
      if(!raw) return;
      const u = raw.toUpperCase();
      const head = u.split(/[·|,/\s]+/)[0];
      const key = /^[A-Z.]{1,8}$/.test(head) ? head : u;
      if(seen.has(key)) return;
      seen.add(key);
      out.push(key);
    });
  });
  return out.sort();
}

function digestFilterSources(d){
  const seen = new Set();
  const out = [];
  ["signals","risks","macro","newtickers"].forEach(k => {
    (d[k] || []).forEach(it => {
      const raw = String((it && it.src) || "").trim();
      if(!raw) return;
      // LLM may merge "Reuters / WSJ" — keep full string as option
      if(seen.has(raw)) return;
      seen.add(raw);
      out.push(raw);
    });
  });
  return out.sort((a,b) => a.localeCompare(b, "en", {sensitivity:"base"}));
}

function digestFilterBar(d){
  const tFilt = effectiveDigestTickerFilter();
  const sFilt = digestSourceFilter;
  let syms = digestFilterSyms(d);
  if(tFilt && !syms.includes(tFilt)) syms = [tFilt].concat(syms);
  const sources = digestFilterSources(d);
  const tickerOpts = [`<option value="">Все тикеры</option>`]
    .concat(syms.map(s => `<option value="${esc(s)}" ${tFilt===s?"selected":""}>${esc(s)}${digestTickerFollowCurrent && current && s===String(current).toUpperCase()?" · текущий":""}</option>`))
    .join("");
  const sourceOpts = [`<option value="">Все источники</option>`]
    .concat(sources.map(s => `<option value="${esc(s)}" ${sFilt===s?"selected":""}>${esc(s)}</option>`))
    .join("");
  let n = 0;
  if(tFilt || sFilt){
    ["signals","risks","macro","newtickers"].forEach(k => {
      (d[k] || []).forEach(it => {
        if(digestItemMatchesFilter(it, tFilt, sFilt)) n += 1;
      });
    });
  }
  const hasFilt = !!(tFilt || sFilt);
  const followHint = digestTickerFollowCurrent && tFilt
    ? `<span class="df-count" title="Следит за выбранным тикером">по ${esc(tFilt)}</span>`
    : (hasFilt ? `<span class="df-count">${esc(String(n))} пункт(ов)</span>` : "");
  return `<div class="digest-filter">
    <label style="font-size:12px;color:var(--dim)">Сток</label>
    <select id="digestTickerSel" onchange="setDigestTickerFilter(this.value)">${tickerOpts}</select>
    <label style="font-size:12px;color:var(--dim)">Источник</label>
    <select id="digestSourceSel" onchange="setDigestSourceFilter(this.value)" style="max-width:min(100%,280px)">${sourceOpts}</select>
    ${followHint}
    ${hasFilt || sFilt ? `<button type="button" class="edit-btn" onclick="resetDigestFilters()" title="Вернуть фильтр к текущему тикеру">Сбросить</button>` : ""}
  </div>`;
}

async function addWatchlistCandidate(sym){
  const u = String(sym || "").trim().toUpperCase();
  if(!u) return;
  if(!confirm(`Добавить ${u} в группу 3 (новые)?`)) return;
  try {
    const r = await fetch("/api/notebook/tickers", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({sym:u, group:"3", updated_by:"watchlist-ui", bootstrap:true}),
    });
    const j = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error((j && (j.detail || j.error)) || (`HTTP ${r.status}`));
    const card = j.card || {sym:u, group:"3", name:u};
    DATA[u] = Object.assign({sym:u, group:"3"}, card);
    WATCHLIST = Object.assign({}, WATCHLIST, {
      candidates: (WATCHLIST.candidates||[]).filter(c => String(c.sym).toUpperCase() !== u),
    });
    currentGroup = "3";
    current = u;
    activeTab = "verdict";
    renderGroupTools(); renderTickers(); renderTabs(); renderContent();
  } catch(e){
    alert("Не удалось добавить: " + (e.message || e));
  }
}

function vixFearLabel(val, state){
  const v = Number(val);
  if(!Number.isFinite(v)){
    if(state==="bad") return "сильный страх";
    if(state==="mid") return "повышенная тревога";
    if(state==="ok") return "спокойный рынок";
    return "нет оценки";
  }
  // Align with notebook thresholds: <20 ok, 20–25 mid, ≥25 bad
  if(v < 15) return "очень спокойно (low fear)";
  if(v < 20) return "спокойный рынок (не сильный страх)";
  if(v < 25) return "повышенная тревога";
  if(v < 30) return "сильный страх";
  return "паника / extreme fear";
}

function findLiveEnvRow(env, key){
  const k = String(key||"").toLowerCase();
  return (env||[]).find(e => {
    if(!e || !e.live) return false;
    if(e.metric && String(e.metric).toLowerCase() === k) return true;
    const lbl = String(e.lbl||"").toLowerCase();
    if(k === "vix") return lbl.includes("vix");
    if(k === "ndx") return lbl.includes("ndx") || lbl.includes("nasdaq");
    if(k === "oil") return lbl.includes("нефт") || lbl.includes("oil") || lbl.includes("геопол");
    return false;
  }) || null;
}

function findLiveVix(env){
  const row = findLiveEnvRow(env, "vix");
  if(!row) return null;
  const val = row.value != null ? Number(row.value) : null;
  return {
    value: Number.isFinite(val) ? val : null,
    state: row.state || "mid",
    st: row.st || "",
    fear: vixFearLabel(val, row.state),
  };
}

function formatEnvLiveBits(env){
  const bits = [];
  const vix = findLiveEnvRow(env, "vix");
  if(vix && vix.value != null && Number.isFinite(Number(vix.value))){
    bits.push(`VIX ${Number(vix.value).toFixed(1)}`);
  }
  const ndx = findLiveEnvRow(env, "ndx");
  if(ndx){
    const v = Number(ndx.value);
    const chg = ndx.chg_pct != null && Number.isFinite(Number(ndx.chg_pct))
      ? `${Number(ndx.chg_pct) >= 0 ? "+" : ""}${Number(ndx.chg_pct).toFixed(1)}%`
      : null;
    if(Number.isFinite(v)) bits.push(chg ? `NDX ${Math.round(v).toLocaleString("en-US")} (${chg})` : `NDX ${Math.round(v).toLocaleString("en-US")}`);
    else if(ndx.st) bits.push(`NDX ${ndx.st}`);
  }
  const oil = findLiveEnvRow(env, "oil");
  if(oil){
    const v = Number(oil.value);
    const chg = oil.chg_pct != null && Number.isFinite(Number(oil.chg_pct))
      ? `${Number(oil.chg_pct) >= 0 ? "+" : ""}${Number(oil.chg_pct).toFixed(1)}%`
      : null;
    if(Number.isFinite(v)) bits.push(chg ? `нефть $${v.toFixed(2)} (${chg})` : `нефть $${v.toFixed(2)}`);
    else if(oil.st) bits.push(`нефть ${oil.st}`);
  }
  return bits;
}

const FEDWATCH_TOOL_URL = "https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html";

function findFedEnvRow(env){
  return (env || []).find(e => {
    if(!e) return false;
    if(String(e.metric || "").toLowerCase() === "fed") return true;
    const lbl = String(e.lbl || "").toLowerCase();
    return lbl.includes("фрс") || lbl.includes("fed") || lbl.includes("fomc");
  }) || null;
}

/** FedWatch hold/cut/hike + link for Verdict Environment row. */
function formatFedWatchBits(env){
  const fed = findFedEnvRow(env);
  const url = FEDWATCH_TOOL_URL;
  if(!fed) return { text: "", url, fomcSt: "" };
  const fw = fed.fedwatch;
  let text = "";
  if(fw && fw.buckets){
    const b = fw.buckets;
    const parts = [`hold ${Math.round(Number(b.hold_pct) || 0)}%`];
    if((Number(b.cut_pct) || 0) >= 1) parts.push(`cut ${Math.round(Number(b.cut_pct))}%`);
    if((Number(b.hike_pct) || 0) >= 1) parts.push(`hike ${Math.round(Number(b.hike_pct))}%`);
    const md = fw.meeting_date ? String(fw.meeting_date) : "";
    text = md ? `FedWatch ${md}: ${parts.join(" · ")}` : `FedWatch: ${parts.join(" · ")}`;
  } else if(fw && fw.st_short){
    text = String(fw.st_short);
  } else if(/FedWatch/i.test(String(fed.st || ""))){
    const m = String(fed.st).match(/FedWatch[^·]*/i);
    text = m ? m[0].trim() : "";
  }
  const fomcSt = String(fed.st || "").replace(/\s*·\s*FedWatch[\s\S]*$/i, "").trim();
  return { text, url: (fw && fw.url) || url, fomcSt };
}

function computeVerdict(d){
  const env = d.env || [];
  const worstEnv = env.reduce((w,e)=>{
    const rank = {ok:0,mid:1,bad:2};
    return (rank[e.state]||0) > (rank[w]||0) ? e.state : w;
  }, "ok");
  const redEnv = env.filter(e => e.state==="bad");
  const yellowEnv = env.filter(e => e.state==="mid");
  const sig = d.signals || {};
  // Thesis only (SocGen). «сент. сломан» replaced by FinBert News sentiment.
  const thesisOff = sig.macroAlive === false;
  const ns = d._newsSent || null;
  const nsLabel = String((ns && ns.label) || "").toLowerCase();
  const newsBearish = nsLabel === "bearish";
  const newsPending = !ns;
  const liveBits = formatEnvLiveBits(env);
  const fwBits = formatFedWatchBits(env);

  const indicators = [];
  // One Environment row: VIX + NDX + oil live here.
  let envVal;
  if(worstEnv==="ok") envVal = "чисто";
  else if(worstEnv==="mid") envVal = `жёлтый: ${yellowEnv.map(e=>e.lbl).join(", ")}`;
  else envVal = `КРАСНЫЙ: ${redEnv.map(e=>e.lbl).join(", ")}`;
  if(liveBits.length){
    envVal = `${liveBits.join(" · ")} · ${envVal}`;
  }
  if(fwBits.fomcSt){
    envVal = `${envVal} · ${fwBits.fomcSt}`;
  }
  if(fwBits.text){
    envVal = `${envVal} · ${fwBits.text}`;
  }
  indicators.push({
    name:"Environment Check",
    state: worstEnv,
    gate: worstEnv==="bad",
    editKind: "env",
    val: envVal,
    fedwatchUrl: fwBits.url || FEDWATCH_TOOL_URL,
  });
  indicators.push({
    name:"Макро · тезис",
    state: thesisOff ? "bad" : "ok",
    gate: thesisOff,
    editKind: "macro",
    val: ""
  });
  let newsState = "neutral";
  if(newsBearish) newsState = "bad";
  else if(nsLabel === "bullish") newsState = "ok";
  else if(nsLabel === "neutral") newsState = "mid";
  else if(newsPending) newsState = "neutral";
  indicators.push({
    name:"News sentiment",
    state: newsState,
    gate: newsBearish,
    editKind: "newsSent",
    val: ""
  });

  const L = d.levels || {};
  const px = d.px;
  let priceState = "neutral", priceVal = "", triggerHit = null;
  if(L.buyDip != null && px != null && Number.isFinite(Number(px))){
    const price = Number(px);
    const buy = Number(L.buyDip);
    const distBuy = ((price - buy) / buy * 100);
    // Distance/trigger only — Close already in hero.
    if(price <= buy){ priceState="ok"; priceVal="триггер buy"; triggerHit="buy"; }
    else if(L.sell != null && price >= Number(L.sell)){ priceState="ok"; priceVal="фиксация"; triggerHit="sell"; }
    else { priceState="mid"; priceVal=`ещё ${distBuy.toFixed(0)}%`; triggerHit="wait"; }
  } else if(L.sell != null && px != null && Number.isFinite(Number(px)) && Number(px) >= Number(L.sell)){
    priceState="ok"; priceVal="фиксация"; triggerHit="sell";
  } else {
    priceState="neutral";
    priceVal = px == null ? "нет Close" : (L.buyDip==null && L.sell==null ? "нет уровней" : "");
    triggerHit = "manual";
  }
  indicators.push({
    name:"Цена vs уровень",
    state:priceState,
    gate:false,
    editKind: "levels",
    val:priceVal
  });

  const c = d.consensus || {};
  const consEmpty = !c.rating || c.rating === "—" || c.rating === "-";
  indicators.push({
    name:"Инвестдома",
    state: consEmpty ? "neutral" : "ok",
    gate:false,
    editKind: "consensus",
    val: ""
  });

  const stopGate = worstEnv==="bad" || thesisOff || newsBearish;
  let action, cls, why;
  if(stopGate){
    action="СТОП · ВНЕ ИГРЫ"; cls="stop";
    const reasons = [];
    if(thesisOff) reasons.push("Макро: тезис AI выкл (macroAlive)");
    if(newsBearish){
      const avg = ns && ns.avg_sentiment != null ? Number(ns.avg_sentiment).toFixed(2) : "—";
      reasons.push(`News sentiment bearish (FinBert ${avg})`);
    }
    if(worstEnv==="bad"){
      const names = redEnv.map(e => e.lbl).filter(Boolean);
      reasons.push(names.length
        ? `Environment красный: ${names.join(", ")}`
        : "Environment Check красный");
    }
    why = reasons.join(". ") + ". Входы на паузу.";
  } else if(triggerHit==="sell"){
    action="ФИКСИРОВАТЬ"; cls="sell";
    why="Close достиг заранее заданного уровня Sell. Решение принято раньше — просто исполняем.";
  } else if(triggerHit==="buy" && worstEnv==="ok"){
    action="ПОКУПАТЬ · триггер"; cls="buy";
    why="Close коснулся заданного Buy Dip, окружение чистое, макро жив. Исполняем план.";
  } else if(triggerHit==="buy" && worstEnv==="mid"){
    action="ЖДАТЬ · жёлтое окружение"; cls="wait";
    const names = yellowEnv.map(e => e.lbl).filter(Boolean);
    why = names.length
      ? `Buy Dip достигнут, но жёлтый Environment: ${names.join(", ")}. Ждём снятия.`
      : "Buy Dip достигнут, но Environment Check жёлтый. Ждём снятия.";
  } else if(triggerHit==="wait" || triggerHit==="manual"){
    if(String(d.group)==="1"){
      action="ДЕРЖАТЬ"; cls="hold";
      why="Группа 1 (удержание). Close ещё не у Buy Dip — не догоняем, ждём свой уровень.";
    } else {
      action="ЖДАТЬ УРОВЕНЬ"; cls="wait";
      why="Триггер входа не сработал. Ждём касания технического уровня.";
    }
  } else {
    action="ДЕРЖАТЬ"; cls="hold"; why="Нейтральное состояние — следим за триггерами.";
  }
  if(worstEnv==="mid" && cls==="hold"){
    const names = yellowEnv.map(e => e.lbl).filter(Boolean);
    why += names.length
      ? ` ⚠ Жёлтый Environment: ${names.join(", ")}.`
      : " ⚠ Environment Check жёлтый.";
  }
  return {action, cls, why, indicators};
}

async function toggleMacroFlag(field, nextVal){
  const sym = current;
  if(!sym || !DATA[sym]) return;
  // Only macroAlive is editable; sentimentBroken replaced by FinBert News sentiment.
  if(field !== "macroAlive") return;
  const status = document.getElementById("flagStatus");
  const btn = document.getElementById("flg-macroAlive");
  if(btn) btn.disabled = true;
  if(status){ status.className = "flag-status"; status.textContent = "сохраняю…"; }
  const body = { macroAlive: !!nextVal };
  try {
    const r = await fetch(`/api/notebook/tickers/${encodeURIComponent(sym)}/signals`, {
      method: "PATCH",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body),
    });
    const j = await r.json().catch(() => ({}));
    if(!r.ok){
      throw new Error((j && (j.detail || j.error)) || (`HTTP ${r.status}`));
    }
    const sig = (j && j.signals) || {};
    DATA[sym].signals = Object.assign({}, DATA[sym].signals || {}, sig);

    if(status){ status.className = "flag-status err"; status.textContent = "ошибка: " + (e.message || e); }
    if(btn) btn.disabled = false;
  }
}

async function saveLevels(){
  const sym = current;
  if(!sym || !DATA[sym]) return;

  const sellEl = document.getElementById("lvl-sell");

  const parseOrNull = (el) => {
    const raw = (el && el.value != null) ? String(el.value).trim() : "";
    if(!raw) return null;
    const n = Number(raw);
    if(!Number.isFinite(n)) throw new Error("нечисловой уровень");
    return n;
  };
  if(btn) btn.disabled = true;
  if(status){ status.className = "flag-status"; status.textContent = "сохраняю…"; }
  try {
    const body = {
      buyDip: parseOrNull(buyEl),
      sell: parseOrNull(sellEl),
      note: (noteEl && noteEl.value != null) ? String(noteEl.value).trim() : "",
    };
    if(!body.note) body.note = null;
    const r = await fetch(`/api/notebook/tickers/${encodeURIComponent(sym)}/levels`, {
      method: "PATCH",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body),
    });
    const j = await r.json().catch(() => ({}));
    if(!r.ok){
      throw new Error((j && (j.detail || j.error)) || (`HTTP ${r.status}`));
    }
    DATA[sym].levels = Object.assign({}, DATA[sym].levels || {}, j.levels || body);
    DATA[sym].levels_override = true;
    applyOverrideMeta(sym, j);
    renderContent();
  } catch(e){
    if(status){ status.className = "flag-status err"; status.textContent = "ошибка: " + (e.message || e); }
    if(btn) btn.disabled = false;
  }
}

async function refreshHouses(){
  const sym = current;
  if(!sym || !DATA[sym]) return;
  const status = document.getElementById("housesStatus");
  const btn = document.getElementById("houses-refresh");
  if(btn) btn.disabled = true;
  housesRefreshFlash = {sym, ok: true, text: "тянем StockAnalysis…"};
  if(status){ status.className = "flag-status"; status.textContent = "тянем StockAnalysis…"; }
  try {
    const r = await fetch(`/api/notebook/tickers/${encodeURIComponent(sym)}/houses/refresh`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({limit: 12}),
    });
    const j = await r.json().catch(() => ({}));
    if(!r.ok){
      const detail = (j && (j.detail || j.error)) || (`HTTP ${r.status}`);
      throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
    }
    if(Array.isArray(j.houses)) DATA[sym].houses = j.houses;
    if(j.consensus) DATA[sym].consensus = Object.assign({}, DATA[sym].consensus || {}, j.consensus);
    if(j.houseNote != null) DATA[sym].houseNote = j.houseNote;
    if(j.houses_counts) DATA[sym].houses_counts = j.houses_counts;
    else if(j.counts) DATA[sym].houses_counts = j.counts;
    DATA[sym].houses_override = true;
    DATA[sym].houses_source = "stockanalysis";
    DATA[sym].consensus_override = true;
    applyOverrideMeta(sym, j);
    const n = (j.houses || []).length;
    // Stats belong in consensus panel (after Выборка) — never in toolbar flash.
    housesRefreshFlash = null;
    renderContent();
    const el = document.getElementById("housesStatus");
    if(el){ el.className = "flag-status ok"; el.textContent = `ок · ${n} карточек`; }
    if(btn) btn.disabled = false;
    setTimeout(() => {
      const st = document.getElementById("housesStatus");
      if(st && /карточек/.test(st.textContent||"")){ st.className = "flag-status"; st.textContent = ""; }
    }, 2000);
  } catch(e){
    housesRefreshFlash = {sym, ok: false, text: "ошибка: " + (e.message || e)};
    if(status){ status.className = "flag-status err"; status.textContent = housesRefreshFlash.text; }
    if(btn) btn.disabled = false;
  }
}

async function setEnvState(key, state, idSuffix){
  const sym = current;
  if(!sym || !DATA[sym]) return;
  const suf = idSuffix || "";
  const status = document.getElementById("envStatus" + suf);
  if(status){ status.className = "flag-status"; status.textContent = "сохраняю…"; }
  document.querySelectorAll(`.env-sbtn[data-env-key="${key}"]`).forEach(b => b.disabled = true);
  const body = key === "fed"
    ? {fed: {state}}
    : {ptCuts: {state}};
  try {
    const r = await fetch(`/api/notebook/tickers/${encodeURIComponent(sym)}/env`, {
      method: "PATCH",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body),
    });
    const j = await r.json().catch(() => ({}));
    if(!r.ok){
      throw new Error((j && (j.detail || j.error)) || (`HTTP ${r.status}`));
    }
    if(Array.isArray(j.env)){
      const vix = (DATA[sym].env||[]).filter(e => e.live && String(e.lbl||"").toLowerCase().includes("vix"));
      const rest = j.env.filter(e => !String(e.lbl||"").toLowerCase().includes("vix"));
      DATA[sym].env = vix.concat(rest);
    }
    DATA[sym].env_override = true;
    applyOverrideMeta(sym, j);
    renderContent();
  } catch(e){
    if(status){ status.className = "flag-status err"; status.textContent = "ошибка: " + (e.message || e); }
    document.querySelectorAll(`.env-sbtn[data-env-key="${key}"]`).forEach(b => b.disabled = false);
  }
}

function incompletenessItems(d){
  const miss = [];
  const L = (d && d.levels) || {};
  if(L.buyDip == null || !Number.isFinite(Number(L.buyDip))){
    miss.push({tab:"verdict", text:"нет Buy Dip — впишите уровень на Вердикте"});
  }
  if(L.sell == null || !Number.isFinite(Number(L.sell))){
    miss.push({tab:"verdict", text:"нет Sell — впишите уровень на Вердикте"});
  }
  const entry = (d.entry || []).filter(x => String(x || "").trim());
  const exitP = (d.exit || []).filter(x => String(x || "").trim());
  if(!entry.length){
    miss.push({tab:"entry", text:"пустая тактика входа"});
  }
  if(!exitP.length){
    miss.push({tab:"entry", text:"пустая тактика выхода"});
  }
  const counts = (d && d.houses_counts) || {};
  const total = Number(counts.total) || 0;
  const cards = (d.houses || []).length;
  if(!cards && total <= 0){
    miss.push({tab:"houses", text:"нет инвестдомов — обновите StockAnalysis"});
  } else {
    const asof = d.override_updated_at_utc || "";
    if(d.houses_override && asof){
      const t = Date.parse(asof);
      if(Number.isFinite(t)){
        const days = (Date.now() - t) / 86400000;
        if(days > 21){
          miss.push({tab:"houses", text:`инвестдома не обновлялись ~${Math.floor(days)}д`});
        }
      }
    }
  }
  return miss;
}

function destroyNbDailyChart(){
  if(_nbDailyChart){
    try { _nbDailyChart.destroy(); } catch(e) {}

function waitForChartJs(timeoutMs){
  return new Promise(function(resolve, reject){
    if(window.Chart){ resolve(); return; }
    const t0 = Date.now();
    const iv = setInterval(function(){
      if(window.Chart){ clearInterval(iv); resolve(); return; }
      if(Date.now() - t0 > (timeoutMs || 20000)){
        clearInterval(iv);
        reject(new Error("Chart.js timeout"));
      }
    }, 50);
  });
}

async function loadVerdictDailyChart(sym, buy, sell){
  const canvas = document.getElementById("nb-daily-chart");

  if(!canvas) return;

    const j = await r.json().catch(() => ({}));
    if(!r.ok){

    }
    const bars = j.bars || [];
    if(!bars.length){
      if(status) status.textContent = "нет дневных quotes";

    }

    const closes = bars.map(b => b.close != null ? Number(b.close) : null);

    const datasets = [
      { label: "Close", data: closes, borderColor: "#38bdf8", tension: 0.1, spanGaps: true, pointRadius: 0 },
      { label: "SMA5", data: sma, borderColor: "#a78bfa", tension: 0.1, spanGaps: true, pointRadius: 0 },
    ];
    if(Number.isFinite(buy) && buy > 0){
      datasets.push({
        label: "Buy Dip @ " + buy.toFixed(2),

        borderColor: "#2ea043",
        borderDash: [6, 4],
        borderWidth: 1.4,
        fill: false,
        pointRadius: 0,
      });
    }
    if(Number.isFinite(sell) && sell > 0){
      datasets.push({
        label: "Sell @ " + sell.toFixed(2),
        data: labels.map(() => sell),
        borderColor: "#d9534f",
        borderDash: [3, 2],
        borderWidth: 1.4,
        fill: false,
        pointRadius: 0,
      });
    }
    _nbDailyChart = new Chart(canvas, {
      type: "line",
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { labels: { color: "#cbd5e1", boxWidth: 12, font: { size: 11 } } },
          tooltip: {
            callbacks: {
              title: function(items){
                const i = items && items[0] ? items[0].dataIndex : 0;
                return labels[i] || "";
              },
              label: function(ctx){
                const v = ctx.parsed && ctx.parsed.y;
                const name = (ctx.dataset && ctx.dataset.label) || "";
                if(v == null || !Number.isFinite(v)) return name + ": —";
                return name + ": $" + (Math.abs(v) >= 100 ? v.toFixed(2) : v.toFixed(2));
              },
            },
          },
        },
        scales: {
          x: {
            ticks: {
              color: "#94a3b8",
              maxTicksLimit: 8,
              maxRotation: 0,
              callback: function(val, idx){
                const lab = labels[idx] || "";
                // YYYY-MM-DD → MM-DD
                return lab.length >= 10 ? lab.slice(5, 10) : lab;
              },
            },
          },
          y: {
            ticks: {
              color: "#94a3b8",
              callback: function(v){
                const n = Number(v);
                if(!Number.isFinite(n)) return v;
                return "$" + (n >= 100 ? n.toFixed(0) : n.toFixed(2));
              },
            },
          },
        },
      },
    });
    if(status){
      const src = j.source || "quotes";
      const last = bars[bars.length - 1] || {};
      const lastPx = last.close != null ? Number(last.close) : null;
      const lastDt = String(last.date || "").slice(0, 10);
      status.textContent = `${sym} · ${labels.length}д · ${src}` +
        (lastDt && Number.isFinite(lastPx) ? ` · посл. ${lastDt} Close $${lastPx.toFixed(2)}` : "") +
        (Number.isFinite(buy) ? ` · Buy ${buy}` : "") +
        (Number.isFinite(sell) ? ` · Sell ${sell}` : "");
    }
  } catch(e){
    if(status) status.textContent = "график: " + (e.message || e);
  }
}

function fmtCalDate(iso){
  if(!iso) return "";
  const d = new Date(iso + "T12:00:00Z");
  if(Number.isNaN(d.getTime())) return esc(iso);
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${String(d.getUTCDate()).padStart(2,"0")} ${months[d.getUTCMonth()]}`;
}

/** Events for ticker tab: macro (FOMC/FRED) + earnings of focus symbol. */
function filterEventsForTicker(events, sym){
  const u = String(sym || "").toUpperCase();
  return (events || []).filter(ev => {
    const kind = String(ev.kind || "");
    if(kind === "fomc" || kind === "economic") return true;
    if(kind === "earnings"){
      if(!u) return true;
      return String(ev.symbol || "").toUpperCase() === u;
    }
    // unknown kinds: keep if no symbol or matches focus
    const es = String(ev.symbol || "").toUpperCase();
    return !es || es === u;
  });
}

function calendarRowsHtml(events, focusSym){
  const u = String(focusSym || "").toUpperCase();
  let lastDate = "";
  const rows = (events || []).slice(0, 60).map(ev => {
    const iso = String(ev.date || "");
    const showDate = iso !== lastDate ? fmtCalDate(iso) : "";
    if(iso) lastDate = iso;
    const kind = String(ev.kind || "other");
    const es = String(ev.symbol || "").toUpperCase();
    const focus = u && es === u ? " focus" : "";
    return `<div class="erow ${esc(kind)}${focus}">
      <span class="date">${esc(showDate)}</span>
      <span class="dot"></span>
      <span class="title" title="${esc(ev.title||"")}">${esc(ev.title||"")}</span>
      <span class="symbol">${esc(ev.symbol||"")}</span>
    </div>`;
  }).join("");
  return rows || `<div class="cal-empty">нет событий · FOMC / FRED / earnings</div>`;
}

let _calLoadedFor = "";
let _calInflight = "";

async function refreshCalendarForTicker(sym, force){
  const u = String(sym || current || "").toUpperCase();
  if(!u) return;
  if(!force && _calLoadedFor === u){
    const body = document.getElementById("calBody");
    if(body) body.innerHTML = calendarRowsHtml(filterEventsForTicker(CALENDAR.events||[], u), u);
    return;
  }
  if(!force && _calInflight === u) return;
  _calInflight = u;
  const status = document.getElementById("calStatus");
  const btn = document.getElementById("cal-refresh");
  if(btn) btn.disabled = true;
  if(status){ status.className = "flag-status"; status.textContent = force ? "обновляем…" : "подгружаем earnings…"; }
  try{
    const r = await fetch(`/api/notebook/calendar?days=21&symbol=${encodeURIComponent(u)}`);
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error((j && (j.detail||j.error)) || (`HTTP ${r.status}`));
    CALENDAR = j;
    _calLoadedFor = u;
    // If user switched ticker while we were loading, don't overwrite their view.
    if(String(current||"").toUpperCase() !== u && !force) return;
    const filtered = filterEventsForTicker(j.events || [], u);
    const body = document.getElementById("calBody");
    const gen = document.getElementById("calGen");
    if(body) body.innerHTML = calendarRowsHtml(filtered, u);
    const cnt = j.counts || {};
    const earnN = filtered.filter(e => e.kind === "earnings").length;
    if(gen) gen.textContent = `${j.asof_utc||""} · FOMC ${cnt.fomc||0} · eco ${cnt.economic||0} · earn ${earnN}`;
    if(status){ status.className = "flag-status ok"; status.textContent = force ? "ок" : ""; }
  }catch(e){
    if(status){ status.className = "flag-status err"; status.textContent = "ошибка: " + (e.message||e); }
  }finally{
    if(_calInflight === u) _calInflight = "";
    if(btn) btn.disabled = false;
  }
}

async function loadNewsSentiment(sym){
  const u = String(sym||"").toUpperCase();
  const valEl = document.getElementById("nsent-val");
  const dotEl = document.getElementById("nsent-dot");
  if(!u || !DATA[u]) return;

  const paint = (j) => {
    _newsSentCache = j;
    const avg = j.avg_sentiment;
    const label = j.label || "—";
    const scored = j.scored_count|0;
    const n = j.news_count|0;
    const st = newsSentStateClass(label);
    if(dotEl){ dotEl.className = "idot " + st.dot; }
    const gate = String(label).toLowerCase() === "bearish"
      ? `<span class="igate">БЛОК</span>` : "";
    const avgTxt = (avg != null && Number.isFinite(Number(avg)))
      ? `<span class="nsent-avg ${st.avg}">${Number(avg).toFixed(2)} · ${esc(label)}</span>`
      : `<span class="nsent-avg neut">нет скоров</span>`;
    if(valEl){
      valEl.innerHTML = `${gate}${avgTxt}
        <span class="note" style="margin-left:8px">FinBert · ${scored}/${n} за 7д</span>
        <button type="button" class="edit-btn" id="nsent-btn" onclick="toggleNewsSentimentArticles()" ${n?"":"disabled"}>статьи</button>`;
    }
  };

  // Re-use cache: paint + skip network (verdict already used _newsSent for gates).
  if(DATA[u]._newsSent && DATA[u]._newsSentKey){
    paint(DATA[u]._newsSent);
    return;
  }
  if(!valEl) return;
  _newsSentOpen = false;
  const arts = document.getElementById("nsent-arts");
  if(arts){ arts.hidden = true; arts.innerHTML = ""; }
  try{
    const r = await fetch(`/api/notebook/tickers/${encodeURIComponent(u)}/news-sentiment?lookback_hours=168&limit=40`);
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.detail || j.error || ("HTTP "+r.status));
    const key = `${j.avg_sentiment}|${j.label}|${j.scored_count}|${j.news_count}`;
    DATA[u]._newsSent = j;
    DATA[u]._newsSentKey = key;
    paint(j);
    // Update STOP/БЛОК in place — full renderContent() here caused open-time blink.
    patchVerdictHero(u);
  }catch(e){
    _newsSentCache = null;
    if(dotEl) dotEl.className = "idot neutral";
    if(valEl){
      valEl.innerHTML = `<span class="note">FinBert · ошибка: ${esc(e.message||e)}</span>
        <button type="button" class="edit-btn" id="nsent-btn" onclick="loadNewsSentiment('${esc(u)}')">повторить</button>`;
    }
  }
}

      DIGEST_SNAPSHOTS = Array.isArray(j.snapshots) ? j.snapshots : [];
      if(j.retain_days != null) DIGEST_RETAIN_DAYS = Number(j.retain_days) || 14;
      DIGEST_SNAPSHOTS_LOADED = true;
    }
  } catch(e){ /* ignore */ }
  if(!DIGEST_SNAPSHOTS.length){
    DIGEST_SNAPSHOTS = [{
      id: DIGEST_SNAPSHOT_ID || "latest",
      date: DIGEST.date || "",
      generated_at_utc: "",
      filtered: DIGEST.filtered,
      kept: DIGEST.kept,
      trashed: DIGEST.trashed,
      is_latest: true,
    }];
    DIGEST_SNAPSHOTS_LOADED = true;
  }
  return DIGEST_SNAPSHOTS;
}

function syncDigestSnapSelect(rows){
  const sel = document.getElementById("digestSnapSel");
  if(!sel || !rows || !rows.length) return;
  const cur = String(DIGEST_SNAPSHOT_ID || "latest");
  const html = rows.map(r =>
    `<option value="${esc(r.id)}" ${String(r.id)===cur?"selected":""}>${esc(digestSnapshotLabel(r))}</option>`
  ).join("");
  sel.innerHTML = html;
}

/** Load snapshot index / fresher latest without full-page re-render (blinks). */
async function hydrateDigestSnapshotsQuiet(){
  if(_digestHydrateInflight || (_digestOptsSynced && _digestAutoLatestTried)) return;
  _digestHydrateInflight = true;
  try{
    const rows = await ensureDigestSnapshots(false);
    syncDigestSnapSelect(rows);
    const live = (rows || []).find(r => r && r.is_latest) || (rows || [])[0];
    if(!_digestAutoLatestTried && digestNeedsLatestRefresh(live)){
      _digestAutoLatestTried = true;
      try{
        const r = await fetch("/api/notebook/digest/snapshots/latest");
        const j = await r.json().catch(() => ({}));
        if(r.ok){
          if(j.digest) DIGEST = j.digest;
          DIGEST_PIPELINE = j.pipeline || {};
          DIGEST_SNAPSHOT_ID = j.id || "latest";
          // Only repaint digest panel if user is looking at it.
          if(activeTab === "digest") renderContent();
          else syncDigestSnapSelect(DIGEST_SNAPSHOTS);
        }
      }catch(e){ /* ignore */ }
    }
    _digestAutoLatestTried = true;
    _digestOptsSynced = true;
  }finally{
    _digestHydrateInflight = false;
  }
}

function digestNeedsLatestRefresh(liveRow){
  if(!liveRow) return false;
  const sid = String(DIGEST_SNAPSHOT_ID || "latest");
  // Never yank the user off an intentionally selected archive snapshot.
  if(sid !== "latest" && !liveRow.is_latest) return false;
  const liveKept = Number(liveRow.kept || 0);
  const curKept = Number((DIGEST && DIGEST.kept) || 0);
  const curErr = !!(DIGEST && DIGEST.llm_error);
  const liveGen = String(liveRow.generated_at_utc || liveRow.date || "");
  const curGen = String((DIGEST && (DIGEST.date || DIGEST.generated_at_utc)) || "");
  // Boot/HTML may still show a failed empty snapshot while API already has a good latest.
  if(liveKept <= 0) return false;
  if(curErr) return true;
  if(curKept === 0) return true;
  if(liveGen && curGen && liveGen.slice(0, 16) !== curGen.slice(0, 16)) return true;
  return false;
}

async function selectDigestSnapshot(id){
  const sid = String(id || "latest");
  try {
    const r = await fetch(`/api/notebook/digest/snapshots/${encodeURIComponent(sid)}`);
    const j = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error((j && j.detail) || (`HTTP ${r.status}`));
    if(j.digest) DIGEST = j.digest;
    DIGEST_PIPELINE = j.pipeline || {};
    DIGEST_SNAPSHOT_ID = j.id || sid;
    renderContent();
  } catch(e){
    console.warn("digest snapshot", e);
  }
}

function shiftDigestSnapshot(dir){
  const rows = DIGEST_SNAPSHOTS || [];
  if(!rows.length) return;
  let idx = rows.findIndex(r => String(r.id) === String(DIGEST_SNAPSHOT_ID));
  if(idx < 0) idx = 0;
  const next = idx + (dir < 0 ? -1 : 1);
  if(next < 0 || next >= rows.length) return;
  selectDigestSnapshot(rows[next].id);
}
