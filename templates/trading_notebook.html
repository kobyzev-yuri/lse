        <li>Это тон ленты, <b>не</b> замена тезиса SocGen / вашей истории.</li>
      </ul>
    </div>

    <div class="card guide-card">
      <h3>Environment Check</h3>
      <p>Итог = <b>худшая</b> из строк: ok &lt; mid &lt; bad. Любой <b>bad</b> → весь Check красный + БЛОК входов.</p>
      <table class="guide-table">
        <tr><th>VIX / NDX / нефть</th><td>Live с котировок. Нефть: вверх = геостресс; вниз обычно ok.</td></tr>
        <tr><th>ФРС</th><td>Live: дата FOMC (fed.gov) + <b>FedWatch</b> hold/cut/hike % (публичный расчёт по CME settlements + FRED, не платный API). Ручные ok/mid/bad поверх. Инструмент CME: <a href="https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html" target="_blank" rel="noopener">FedWatch Tool</a>.</td></tr>
        <tr><th>Таргеты (PT cuts)</th><td><b>Только вручную</b> на Вердикте (кнопки «таргеты»). Это не ваш Sell и не средний PT с «Инвестдома». Гейт про <b>волну cut PT вне earnings</b>.</td></tr>
      </table>
      <div class="gex"><b>Как ставить таргеты</b>
        Факты — с вкладки «Инвестдома» (lowered PT) и дайджеста.
        <b>ok</b> — тихо, нет волны cuts.
        <b>mid</b> — 1–2 заметных cut, тезис ещё жив (у Buy Dip ждать).
        <b>bad</b> — серия cuts / смена консенсуса вниз вне отчёта → БЛОК входов.
        После успокоения верните ok. Один cut у одного дома редко = сразу bad.
      </div>
      <p>Цифры в строке (VIX 17.6 · NDX …) — справка; цвет и БЛОК — от <b>state</b> строк.</p>
    </div>

    <div class="card guide-card">
      <h3>Инвестдома vs ваши уровни</h3>
      <table class="guide-table">
        <tr><th>На Вердикте</th><td><b>Только чтение</b> того же консенсуса, что на вкладке «Инвестдома». Править / обновлять — там (StockAnalysis).</td></tr>
        <tr><th>Консенсус / ср. таргет SA</th><td>Полная статистика StockAnalysis (~12 мес). Не ваш Buy Dip / Sell и не среднее по списку домов.</td></tr>
        <tr><th>Рейтинги SA (напр. 56)</th><td>Выборка Buy/Hold/Sell на SA. Таргеты могут иметь свой n (PT n).</td></tr>
        <tr><th>В списке (напр. 8 домов)</th><td>Карточки последних нот — лимит парсинга ~10–12, не вся выборка SA.</td></tr>
      </table>
      <ul>
        <li><b>Strong Buy ≠ покупай сейчас.</b></li>
        <li><b>Ср. таргет ≠ ваш Sell</b> (Sell свой; PT — чужой ориентир).</li>
        <li><b>Low</b> — медвежий коридор ожиданий Street, не обязательно ваш стоп.</li>
        <li>Техника первая; дома — фон и проверка «не сломан ли консенсус».</li>
      </ul>
    </div>

    <div class="card guide-card">
      <h3>Чеклист перед сделкой</h3>
      <ol class="guide-ol">
        <li><b>Группа и горизонт</b> — G1 месяцами, не интрадей.</li>
        <li><b>Уровни записаны?</b> — buy / sell на Вердикте.</li>
        <li><b>Где Close?</b> — далеко / у Buy Dip / у Sell (смотрите daily на Вердикте).</li>
        <li><b>Тезис вкл?</b></li>
        <li><b>Environment</b> не красный? (жёлтый у Buy Dip → ждать)</li>
        <li><b>News sentiment</b> не bearish-блок?</li>
        <li><b>Дома как фон</b> — нет свежих mass cut PT; не сидим у High без смысла.</li>
        <li>Всё ок и Close у уровня → <b>исполняем записанный план</b>.</li>
      </ol>
    </div>

    <div class="card guide-card">
      <h3>Что система ведёт</h3>
      <p>Только тикеры <b>в группах</b> (G1 / G2 / G3 / «Новые»).</p>
      <table class="guide-table">
        <tr><th>G1 / G2</th><td>Рабочий план: уровни, вердикт, дома.</td></tr>
        <tr><th>G3</th><td>Кандидаты, уже заведённые в тетрадку.</td></tr>
        <tr><th>Новые</th><td>Первичный разбор; потом в G1–G3 или отсев.</td></tr>
      </table>
    </div>

    <div class="card guide-card">
      <h3>Словарь</h3>
      <table class="guide-table">
        <tr><th>Вердикт</th><td>Стоп / ждать / докупать / фиксировать — по правилам.</td></tr>
        <tr><th>Close</th><td>Цена закрытия (live) для сравнения с уровнями.</td></tr>
        <tr><th>Горизонт</th><td>На сколько рассчитан план (G1: 3–6 мес; G2: дни–неделя).</td></tr>
        <tr><th>Триггер</th><td>Условие «пора исполнять» (цена у уровня + гейты ок).</td></tr>
        <tr><th>Events</th><td>FOMC / macro / earnings тикера — календарь, не сигнал входа.</td></tr>
      </table>
      <p class="note">Не смешивать с GAME_5M и «Портфель · карточки»: тетрадка — ручная дисциплина уровней. Daily на Вердикте = тот же источник, что у портфельного daily-графика.</p>
    </div>
  `);
}

function bootApp(){
  try {
    const el = document.getElementById("boot");
    const boot = JSON.parse(el.textContent);
    applyBoot(boot);
    renderGroupNav(); renderTickers(); renderTabs(); renderContent();
    // Background: refresh digest index without touching the visible verdict panel.
    queueMicrotask(() => { hydrateDigestSnapshotsQuiet(); });
  } catch(e){
    document.getElementById("content").innerHTML = `<div class="load-err">Ошибка загрузки тетрадки: ${esc(e.message)}</div>`;
  }
}
bootApp();

</script>
